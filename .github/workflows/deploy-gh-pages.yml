name: Deploy to GitHub Pages (temporary preview)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          # Repo bukan <user>.github.io, jadi Pages punya subpath /bitombang.com.
          # Pindah ke Netlify/CF Pages/Vercel nanti, workflow ini tinggal dihapus —
          # astro.config.mjs otomatis balik ke domain asli tanpa env ini.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
